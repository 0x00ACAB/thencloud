name: Docs

# Builds docs/ with mdBook and publishes it to GitHub Pages
# (docs.kkaii.xyz), together with the F-Droid repo at /fdroid/repo
# (scripts/fdroid-repo.sh: the APKs of the latest releases, listed in an
# index signed with the repo's own key). A deploy replaces the whole site,
# so every deploy rebuilds both; publishing a release runs it too (on main,
# see on-release). Pull requests only build them, the repo with a throwaway
# key, to catch breakage.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - CHANGELOG.md
      - fdroid/**
      - scripts/fdroid-repo.sh
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - CHANGELOG.md
      - fdroid/**
      - scripts/fdroid-repo.sh
      - .github/workflows/docs.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A published release runs this on its tag, which the github-pages
  # environment doesn't deploy from (only main may). So it just starts this
  # workflow again on main, which picks up the new release's APK.
  on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: mdbook@0.5.4
      - run: mdbook build docs
      # pipx is on the runner image; fdroidserver's apksigner and jarsigner come from its Android SDK and JDK.
      - run: pipx install fdroidserver==2.4.5
      - name: F-Droid repo
        env:
          GH_TOKEN: ${{ github.token }}
          FDROID_KEYSTORE: ${{ secrets.FDROID_KEYSTORE }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ -z "$FDROID_KEYSTORE" ]; then
            # Only a pull request may go without the real key: its build is never published.
            [ "$PR" = true ] || { echo "FDROID_KEYSTORE isn't set"; exit 1; }
            FDROID_KEYSTORE_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/throwaway.p12" -storepass "$FDROID_KEYSTORE_PASS" \
              -alias thencloud-fdroid -keyalg RSA -keysize 4096 -validity 1 -dname CN=throwaway
            FDROID_KEYSTORE=$(base64 -w0 "$RUNNER_TEMP/throwaway.p12")
            export FDROID_KEYSTORE FDROID_KEYSTORE_PASS
          fi
          scripts/fdroid-repo.sh docs/book/fdroid
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
