name: Release

# Builds the web client reproducibly on two different runner images and
# fails unless both come out byte for byte the same, and builds the server
# and CLI binaries. On a tag, every file is signed with Sigstore (keyless,
# as this workflow at this tag) and they go into a draft release; a
# maintainer rebuilds the web client locally, adds a minisign signature of
# the manifest and publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web client (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: scripts/release-web.sh "$VERSION"
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: web-${{ matrix.os }}
          path: thencloud-web-*

  binaries:
    name: Binaries (${{ matrix.target }})
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so the binaries run on older glibc.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p thencloud-server -p thencloud-cli
      - name: Package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          dir="thencloud-$VERSION-$TARGET"
          mkdir "$dir"
          cp target/release/thencloud-server target/release/thencloud LICENSE README.md "$dir"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: thencloud-*.tar.gz

  publish:
    name: Compare, sign and draft the release
    needs: [web, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the Sigstore certificate: GitHub vouches that this workflow, at
      # this tag, is signing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Both builds must be identical
        run: |
          cmp web-ubuntu-24.04/thencloud-web-*.json web-ubuntu-22.04/thencloud-web-*.json
          cmp web-ubuntu-24.04/thencloud-web-*.tar.gz web-ubuntu-22.04/thencloud-web-*.tar.gz
          sha256sum web-ubuntu-24.04/thencloud-web-*
      - uses: sigstore/cosign-installer@v4
        if: github.ref_type == 'tag'
      # Keyless: a short-lived certificate from Sigstore's Fulcio naming this
      # workflow and tag, the signature logged in Rekor, all in a
      # .sigstore.json bundle per file. `thencloud verify-web` checks the
      # manifest's bundle offline. Pinned to Rekor v1, whose signed entry
      # timestamps verify-web knows how to check.
      - name: Sign with Sigstore
        if: github.ref_type == 'tag'
        run: |
          for f in web-ubuntu-24.04/thencloud-web-* bin-*/thencloud-*.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" --use-signing-config=false \
              --fulcio-url https://fulcio.sigstore.dev --rekor-url https://rekor.sigstore.dev "$f"
          done
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "The server needs the web client next to it: unpack thencloud-web-$GITHUB_REF_NAME.tar.gz and pass --web-dir dist. Check a server runs this web client: download thencloud-web-$GITHUB_REF_NAME.json and its .sigstore.json, then run thencloud verify-web https://your.server --manifest thencloud-web-$GITHUB_REF_NAME.json" \
            web-ubuntu-24.04/thencloud-web-* bin-*/thencloud-*.tar.gz bin-*/thencloud-*.tar.gz.sigstore.json
