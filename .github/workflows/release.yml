name: Release

# Builds the web client reproducibly on two different runner images and
# fails unless both come out byte for byte the same, and builds the server
# and CLI binaries, the desktop and Android apps and the Docker image. On a
# tag, every file is signed with Sigstore (keyless, as this workflow at this
# tag) and they go into a draft release with that version's CHANGELOG
# section; the image goes to ghcr.io, signed the same way. A maintainer
# rebuilds the web client locally, adds a minisign signature of the
# manifest and publishes.
#
# The Android APK is signed with the release key in the repository's
# secrets (ANDROID_KEYSTORE, base64; ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Every APK must be signed with the
# same key, or it can't update the one already installed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web client (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack
      - run: scripts/release-web.sh "$VERSION"
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: web-${{ matrix.os }}
          path: thencloud-web-*

  binaries:
    name: Binaries (${{ matrix.target }})
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so the binaries run on older glibc.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo build --release --locked -p thencloud-server -p thencloud-cli
      - name: Package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          dir="thencloud-$VERSION-$TARGET"
          mkdir "$dir"
          cp target/release/thencloud-server target/release/thencloud LICENSE README.md "$dir"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: thencloud-*.tar.gz


  desktop:
    name: App (${{ matrix.os }})
    strategy:
      matrix:
        # The oldest supported Ubuntu, so the packages run on older glibc.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm
      - run: scripts/build-app.sh
        env:
          TAURI: npx --yes @tauri-apps/cli@2
      - name: Collect
        run: |
          mkdir out
          b=crates/thencloud-app/target/release/bundle
          cp $b/deb/*.deb $b/rpm/*.rpm $b/appimage/*.AppImage out/ 2>/dev/null || true
          cp $b/nsis/*.exe $b/msi/*.msi out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: out/*

  android:
    name: App (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack,cargo-binstall
      # The real binary, not npx: `android init` writes the command it was
      # run with into the Gradle project.
      - run: cargo binstall -y --locked tauri-cli@^2
      - run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-app.sh android --apk
        env:
          TAURI: cargo tauri
      # Aligned for 16 KB pages (Android 15 and later), then signed with the
      # release key. Only on a tag: pull requests don't get the secrets.
      - name: Sign
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ github.ref_name }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          unsigned=crates/thencloud-app/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$tools/zipalign" -f -P 16 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          mkdir out
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS --out "out/thencloud-$VERSION-android.apk" "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" verify --print-certs "out/thencloud-$VERSION-android.apk"
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: app-android
          path: out/*.apk

  docker:
    name: Docker image (${{ matrix.arch }})
    if: github.ref_type == 'tag'
    strategy:
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and push by digest
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --use
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            --build-arg "THENCLOUD_VERSION=$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta.json .
          mkdir digests
          jq -r '."containerimage.digest"' meta.json > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*

  image:
    name: Docker image (tag and sign)
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Tag both architectures as one image, and sign it
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --use
          refs=()
          for d in digests/*; do refs+=("$image@$(cat "$d")"); done
          docker buildx imagetools create -t "$image:$VERSION" -t "$image:${VERSION#v}" -t "$image:latest" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "$image@$digest"
          echo "Signed $image@$digest"

  publish:
    name: Compare, sign and draft the release
    needs: [web, binaries, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the Sigstore certificate: GitHub vouches that this workflow, at
      # this tag, is signing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Both builds must be identical
        run: |
          cmp web-ubuntu-24.04/thencloud-web-*.json web-ubuntu-22.04/thencloud-web-*.json
          cmp web-ubuntu-24.04/thencloud-web-*.tar.gz web-ubuntu-22.04/thencloud-web-*.tar.gz
          sha256sum web-ubuntu-24.04/thencloud-web-*
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.ref_type == 'tag'
      # Keyless: a short-lived certificate from Sigstore's Fulcio naming this
      # workflow and tag, the signature logged in Rekor, all in a
      # .sigstore.json bundle per file. `thencloud verify-web` checks the
      # manifest's bundle offline. Pinned to Rekor v1, whose signed entry
      # timestamps verify-web knows how to check.
      - name: Sign with Sigstore
        if: github.ref_type == 'tag'
        run: |
          for f in web-ubuntu-24.04/thencloud-web-* bin-*/thencloud-*.tar.gz app-*/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" --use-signing-config=false \
              --fulcio-url https://fulcio.sigstore.dev --rekor-url https://rekor.sigstore.dev "$f"
          done
      - uses: actions/checkout@v7
        if: github.ref_type == 'tag'
        with:
          path: src
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$GITHUB_REF_NAME"
          # This version's section of CHANGELOG.md ("## v1.0.0 ..." up to the next "## ").
          awk -v v="$v" '$1 == "##" && $2 == v { on = 1; next } on && /^## / { exit } on' src/CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Checking what you run

          Every file here is signed with Sigstore by this repository's release workflow at this tag (the \`.sigstore.json\` next to it), and the web client's manifest is also signed with minisign by a maintainer (\`.minisig\`).

          - **A server:** download \`thencloud-web-$v.json\` with its \`.sigstore.json\` and \`.minisig\`, then run \`thencloud verify-web https://your.server --manifest thencloud-web-$v.json\`.
          - **The manifest alone, with minisign:** \`minisign -Vm thencloud-web-$v.json -P RWQ1oV8khQ/NC3Vr+guqukqswrgh3NOwJ8mAlRzjlvivenzDuRex3+U2\` (the maintainers' keys are also in the README).
          - **Any other file:** \`cosign verify-blob --bundle FILE.sigstore.json --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$v --certificate-oidc-issuer https://token.actions.githubusercontent.com FILE\`
          - **The Docker image:** \`cosign verify ghcr.io/${GITHUB_REPOSITORY,,}:$v --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$v --certificate-oidc-issuer https://token.actions.githubusercontent.com\`

          The server needs the web client next to it: unpack \`thencloud-web-$v.tar.gz\` and pass \`--web-dir dist\`, or use the image \`ghcr.io/${GITHUB_REPOSITORY,,}:$v\`, which has both.
          EOF
          gh release create "$v" --draft --repo "$GITHUB_REPOSITORY" --title "thencloud $v" --notes-file notes.md \
            web-ubuntu-24.04/thencloud-web-* bin-*/thencloud-*.tar.gz bin-*/thencloud-*.tar.gz.sigstore.json app-*/*
