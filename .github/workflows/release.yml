name: Release

# Builds the web client reproducibly on two different runner images and
# fails unless both come out byte for byte the same, and builds the server
# and CLI binaries. On a tag, the manifest, the web build and the binaries
# go into a draft release; a maintainer rebuilds the web client locally,
# signs the manifest with minisign and publishes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web client (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: scripts/release-web.sh "$VERSION"
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: web-${{ matrix.os }}
          path: thencloud-web-*

  binaries:
    name: Binaries (${{ matrix.target }})
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so the binaries run on older glibc.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p thencloud-server -p thencloud-cli
      - name: Package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          dir="thencloud-$VERSION-$TARGET"
          mkdir "$dir"
          cp target/release/thencloud-server target/release/thencloud LICENSE README.md "$dir"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: thencloud-*.tar.gz

  publish:
    name: Compare and draft the release
    needs: [web, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Both builds must be identical
        run: |
          cmp web-ubuntu-24.04/thencloud-web-*.json web-ubuntu-22.04/thencloud-web-*.json
          cmp web-ubuntu-24.04/thencloud-web-*.tar.gz web-ubuntu-22.04/thencloud-web-*.tar.gz
          sha256sum web-ubuntu-24.04/thencloud-web-*
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "The server needs the web client next to it: unpack thencloud-web-$GITHUB_REF_NAME.tar.gz and pass --web-dir dist. Check a server runs this web client: thencloud verify-web https://your.server --manifest thencloud-web-$GITHUB_REF_NAME.json" \
            web-ubuntu-24.04/thencloud-web-* bin-*/thencloud-*.tar.gz
