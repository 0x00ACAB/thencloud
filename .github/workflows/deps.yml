name: Dependencies

# Known vulnerabilities and licences in Rust and npm dependencies: on pull
# requests that change them, and weekly, since new advisories appear without
# any change here.

on:
  pull_request:
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - deny.toml
      - web/package.json
      - web/package-lock.json
      - .github/workflows/deps.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Reads the lockfile; nothing needs installing.
      - run: npm audit --audit-level=moderate
        working-directory: web
