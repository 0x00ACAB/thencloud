name: App

# Builds the Tauri app (crates/thencloud-app) for Linux, Windows and
# Android: on pull requests that touch it and by hand. The installers and
# APKs are uploaded as artifacts, unsigned; release.yml builds the signed
# ones for a release.

on:
  pull_request:
    paths:
      - crates/thencloud-app/**
      - scripts/build-app.sh
      - web/src/lib/server.svelte.js
      - .github/workflows/app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI: npx --yes @tauri-apps/cli@2

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Ubuntu, so the packages run on older glibc.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/thencloud-app
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm
      - run: scripts/build-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: |
            crates/thencloud-app/target/release/bundle/deb/*.deb
            crates/thencloud-app/target/release/bundle/rpm/*.rpm
            crates/thencloud-app/target/release/bundle/appimage/*.AppImage
            crates/thencloud-app/target/release/bundle/nsis/*.exe
            crates/thencloud-app/target/release/bundle/msi/*.msi

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/thencloud-app
      # The real binary, not npx: `android init` writes the command it was
      # run with into the Gradle project, and `npm run tauri` needs a
      # package.json there.
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack,cargo-binstall
      - run: cargo binstall -y --locked tauri-cli@^2
      - run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-app.sh android
        env:
          TAURI: cargo tauri
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-android
          path: |
            crates/thencloud-app/gen/android/app/build/outputs/apk/**/*.apk
            crates/thencloud-app/gen/android/app/build/outputs/bundle/**/*.aab
