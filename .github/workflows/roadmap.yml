name: Roadmap

on:
  push:
    branches: [main]
    paths:
      - MILESTONES.md
      - .github/scripts/roadmap.js
      - .github/workflows/roadmap.yml
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would change
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: roadmap

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sync = require('./.github/scripts/roadmap.js');
            await sync({ github, context, core, dryRun: ${{ inputs.dry-run == true }} });
