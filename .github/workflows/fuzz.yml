name: Fuzz

# cargo-fuzz targets in fuzz/, built once and run one after another in a
# single job: four minutes each weekly, and twenty seconds each on pull
# requests that change fuzzed code. The corpus is kept between runs, and a
# crash uploads its input. Run it by hand for a longer go.

on:
  pull_request:
    paths:
      - fuzz/**
      - crates/thencloud-crypto/**
      - crates/thencloud-server/src/webauthn.rs
      - crates/thencloud-server/src/totp.rs
      - crates/thencloud-server/src/util.rs
      - crates/thencloud-cli/src/backup.rs
      - crates/thencloud-cli/src/nextcloud.rs
      - crates/thencloud-cli/src/sigstore.rs
      - .github/workflows/fuzz.yml
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '300'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGETS: crypto-decode sealed-box webauthn-register webauthn-assert api-json server-input backup-read nextcloud-listing sigstore-bundle
  SECONDS_EACH: ${{ github.event_name == 'schedule' && 240 || github.event_name == 'workflow_dispatch' && inputs.seconds || 20 }}

jobs:
  fuzz:
    name: Fuzz every target
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@0e28dd9a7764e5f83064112bb1f24025a14c313c # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-fuzz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build
        working-directory: fuzz
        # The prebuilt cargo-fuzz is a musl binary and would build for musl,
        # which the sanitizers don't support.
        run: cargo fuzz build --target x86_64-unknown-linux-gnu
      - name: Fuzz
        working-directory: fuzz
        # Every target runs even if one finds a crash; the job fails at the end.
        run: |
          failed=""
          for t in $TARGETS; do
            echo "::group::$t"
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time="$SECONDS_EACH" -max_len=4096 || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::crashes in:$failed"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
