name: CI

# Pull requests only: a merge to main is the code its pull request already
# tested, so nothing runs again on main (CI minutes are limited), and
# documentation alone doesn't run it: `changes` skips the other jobs then.
# Not paths-ignore, since these are required checks, and a workflow that
# never starts leaves them pending; a skipped job counts as passed. Caches saved in a pull request can't
# be used by the next one, only those saved on main, so once a week the Rust
# and Web jobs run on main to keep those warm (GitHub drops caches unused
# for 7 days).
on:
  schedule:
    - cron: '23 5 * * 1'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Not a pull request, or the file list can't be read: run everything.
          if [ -z "$PR" ] || ! files="$(gh pr diff "$PR" --name-only -R "$GITHUB_REPOSITORY")"; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qvE '\.md$|^docs/|^LICENSE$|^\.github/scripts/roadmap\.js$|^\.github/workflows/roadmap\.yml$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # The workflows themselves: injection, unpinned or impostor actions,
  # credentials left in checkouts, caches in release builds.
  zizmor:
    name: Workflows (zizmor)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.0 --format=github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # For the FUSE mount tests in thencloud-cli.
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fuse3
      - run: cargo test --workspace

  web:
    name: Web (WASM, svelte-check, build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: wasm-pack build crates/thencloud-wasm --release --target web --out-dir ../../web/src/wasm --no-typescript --no-pack
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run check
        working-directory: web
      # Fuzz tests of the parsers for untrusted files (tags, photos, CSV...),
      # and the format test vectors against the WASM build.
      - run: npm test
        working-directory: web
        env:
          FUZZ_RUNS: 20000
      - run: npm run build
        working-directory: web

  browser:
    name: Browser tests (Playwright)
    needs: changes
    # Nothing to cache here that the other jobs don't.
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: wasm-pack build crates/thencloud-wasm --release --target web --out-dir ../../web/src/wasm --no-typescript --no-pack
      - run: cargo build -p thencloud-server
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
