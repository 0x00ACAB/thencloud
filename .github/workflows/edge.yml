name: Edge image

# Builds the Docker image from main, when run, and puts it on ghcr.io as
# `edge` and `sha-<commit>`, for both architectures, signed with Sigstore
# (keyless, as this workflow on main); and the with-downloader target
# (Dockerfile) the same way, as `edge-downloader` and
# `sha-<commit>-downloader`, for admins who want the video downloader
# without building it themselves. A server can pin a `sha-` tag and update
# by pulling the next one instead of building on its own hardware. Releases
# still get their own `vX.Y.Z` and `latest` tags (and `-downloader` ones)
# from release.yml.
#
# Check one with:
#   cosign verify ghcr.io/0x00acab/thencloud:sha-<commit> \
#     --certificate-identity https://github.com/0x00ACAB/thencloud/.github/workflows/edge.yml@refs/heads/main \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

# Run by hand (Actions > Edge image > Run workflow, on main), not on every
# push: four Docker builds take about 26 runner minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older build pointless.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  docker:
    # Only main is published as edge (and only main matches the cosign identity above).
    if: github.ref == 'refs/heads/main'
    name: Docker image (${{ matrix.arch }}, ${{ matrix.target }})
    strategy:
      matrix:
        arch: [amd64, arm64]
        target: [runtime, with-downloader]
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push by digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="main-${GITHUB_SHA::12}"
          docker buildx create --use
          docker buildx build --platform "linux/${{ matrix.arch }}" \
            --target "${{ matrix.target }}" \
            --build-arg "THENCLOUD_VERSION=$version" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta.json .
          mkdir digests
          jq -r '."containerimage.digest"' meta.json > "digests/${{ matrix.target }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*

  image:
    name: Docker image (tag and sign, ${{ matrix.target }})
    needs: [docker]
    strategy:
      matrix:
        include:
          - { target: runtime, suffix: "" }
          - { target: with-downloader, suffix: "-downloader" }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
          path: digests
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Tag both architectures as one image, and sign it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --use
          refs=()
          for d in digests/*; do refs+=("$image@$(cat "$d")"); done
          docker buildx imagetools create -t "$image:sha-${GITHUB_SHA::12}${{ matrix.suffix }}" -t "$image:edge${{ matrix.suffix }}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "$image:sha-${GITHUB_SHA::12}${{ matrix.suffix }}" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "$image@$digest"
          echo "Signed $image@$digest"
