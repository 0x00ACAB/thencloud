# CodeQL settings for .github/workflows/codeql.yml.
query-filters:
  # Flags fixed passwords and salts in tests (on purpose: tests need known
  # inputs) and zeroed buffers in thencloud-crypto that are filled from the
  # RNG or HKDF on the next line. Every alert it raised was one of those.
  - exclude:
      id: rust/hard-coded-cryptographic-value
