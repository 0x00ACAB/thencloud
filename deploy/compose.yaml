# thencloud behind Caddy, which gets a TLS certificate for your domain.
#
#   THENCLOUD_DOMAIN=cloud.example.com docker compose -f deploy/compose.yaml up -d
#
# Point the domain's DNS at this machine first, and keep ports 80 and 443
# open for Caddy. Back up with:
#   docker compose -f deploy/compose.yaml exec thencloud thencloud-server backup /data/backup-$(date +%F)
# (the backup lands in the thencloud-data volume; copy it somewhere else).

services:
  thencloud:
    build: ..
    image: thencloud
    restart: unless-stopped
    environment:
      # Caddy is the only way in, so its X-Forwarded-For can be trusted
      # (it's used for rate-limiting sign-in attempts, never stored).
      THENCLOUD_TRUST_PROXY: "true"
      # Nobody but the first account can sign up until you choose invite
      # only (or open) in the Admin view. Open lets anyone who finds the
      # server store files you can't see.
      THENCLOUD_ALLOW_REGISTRATION: "false"
      # The first account (the admin) needs the setup code printed at first
      # start: docker compose logs thencloud | grep "setup code". Optionally
      # fix its name too:
      # THENCLOUD_ADMIN_USERNAME: "you"
      # THENCLOUD_METRICS_TOKEN: "a long random string"
      # Keep the encrypted blobs in an S3-compatible bucket instead of the
      # data volume (the SQLite database always stays in /data):
      # THENCLOUD_S3_ENDPOINT: "https://s3.example.com"
      # THENCLOUD_S3_BUCKET: "thencloud"
      # THENCLOUD_S3_ACCESS_KEY: "..."
      # THENCLOUD_S3_SECRET_KEY: "..."
      # THENCLOUD_S3_PREFIX: "thencloud/"
      # Keep the blobs on the data volume too (read from there, the bucket
      # as the copy); the database is snapshotted to the bucket daily either
      # way, so `restore-snapshot` can rebuild from the bucket alone:
      # THENCLOUD_S3_MIRROR: "true"
    volumes:
      - thencloud-data:/data
    # No ports: only Caddy reaches it, over the compose network.
    # It writes nothing outside /data and needs no privileges.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      THENCLOUD_DOMAIN: ${THENCLOUD_DOMAIN:?set THENCLOUD_DOMAIN to your domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - thencloud

volumes:
  thencloud-data:
  caddy-data:
