[package]
name = "thencloud-cli"
description = "Command-line client for thencloud: encrypts and decrypts locally, signs in with an app password"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "thencloud"
path = "src/main.rs"

[dependencies]
thencloud-crypto.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["json", "brotli"] }
sha2.workspace = true
minisign-verify = "0.3"
# Sigstore bundles (sigstore.rs): certificates parsed with RustCrypto, signatures checked with ring.
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
ring = "0.17"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
dav-server = { version = "0.11", default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
futures-util = "0.3"
bytes = "1"
xmltree = "0.12"
httpdate = "1"
percent-encoding = "2"
base64.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18"
libc = "0.2"

[dev-dependencies]
flate2 = "1"
blake2 = "0.11"
percent-encoding = "2"
httpdate = "1"
base64.workspace = true
thencloud-server = { path = "../thencloud-server" }
axum = "0.8"
