[package]
name = "thencloud-crypto"
description = "Client-side cryptography and wire types for thencloud"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
sha2.workspace = true
getrandom = { workspace = true, features = ["wasm_js"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
hkdf = "0.13"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
zeroize = { version = "1", features = ["derive"] }
ml-kem = { version = "0.3", features = ["zeroize", "hazmat"] }

# NFC for passwords and name tags. The browser has it built in, which keeps
# the tables out of the WASM.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
unicode-normalization = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
