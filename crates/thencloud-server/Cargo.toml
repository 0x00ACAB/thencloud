[package]
name = "thencloud-server"
description = "Zero-knowledge file cloud server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "thencloud-server"
path = "src/main.rs"

[dependencies]
thencloud-crypto.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
sha2.workspace = true
hmac.workspace = true
getrandom.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "time", "process", "io-util", "net", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace", "set-header"] }
argon2 = "0.6"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ring = "0.17"
ciborium = "0.2"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio"] }
# The HTTPS client for S3, on rustls with ring (already used here) rather
# than aws-lc, which needs a C toolchain and cmake to build.
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
