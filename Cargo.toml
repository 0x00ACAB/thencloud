[workspace]
resolver = "2"
members = ["crates/thencloud-crypto", "crates/thencloud-wasm", "crates/thencloud-server", "crates/thencloud-cli"]
exclude = ["fuzz", "crates/thencloud-app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/0x00ACAB/thencloud"
publish = false

[workspace.dependencies]
thencloud-crypto = { path = "crates/thencloud-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"

# Argon2 is painfully slow unoptimised; keep dev builds (and tests) usable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
